services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intechsys-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./secrets/google-service-account.json:/app/secrets/google-service-account.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    container_name: intechsys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intechsys_zt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intechsys_zt"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
