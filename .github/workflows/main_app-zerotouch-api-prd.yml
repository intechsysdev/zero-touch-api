# API de Zero-touch (Node.js) en Azure App Service (Linux) - app-zerotouch-api-prd
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js API to Azure Web App - app-zerotouch-api-prd

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Carga el servidor y sus rutas sin conectarse a la base de datos (el pool se abre con la
      # primera consulta), igual que el pipeline anterior.
      - name: Verify syntax & server boot
        run: |
          node -e "const { app } = require('./src/server'); console.log('Backend syntax and routes verified successfully.');"
        env:
          NODE_ENV: test
          ZERO_TOUCH_PARTNER_ID: '1450835637'
          ONE_BASE_URL: https://app-intechsysone-api-prd-bxehhkf8dgcwbve9.centralus-01.azurewebsites.net
          ONE_APP_SLUG: zero-touch

      - name: Install production dependencies only
        run: npm ci --omit=dev

      # App Service ejecuta "npm start" sobre lo que se despliega: va con node_modules incluido
      # para no depender de que compile en el servidor.
      - name: Zip artifact for deployment
        run: zip -r -q release.zip package.json package-lock.json src node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_103BD05C1F974484A74082B4B009F8AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_26C5FDE9E26849218002E621D0530998 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_410C196EC0AD406587EC7E4B5F2E2FEC }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-zerotouch-api-prd'
          slot-name: 'Production'
          package: release.zip
          # OneDeploy: reemplaza wwwroot (sin node_modules viejos mezclados) y reinicia la app.
          type: zip
          clean: true
          restart: true
