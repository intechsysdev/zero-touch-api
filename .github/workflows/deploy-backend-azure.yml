name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify syntax & server boot
        run: |
          node -e "const { app } = require('./src/server'); console.log('Backend syntax and routes verified successfully.');"
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_value_12345
          DB_URL: postgres://postgres:postgres@localhost:5432/intechsys_zt
          ZERO_TOUCH_PARTNER_ID: '1450835637'
          ONE_BASE_URL: https://intechsys-one-api-b5b5a6cbf9emevev.centralus-01.azurewebsites.net
          ONE_APP_SLUG: zero-touch

      - name: Azure Login
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy to Azure Container Apps
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToBuild: ${{ secrets.ACR_NAME }}.azurecr.io/intechsys-backend:${{ github.sha }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
